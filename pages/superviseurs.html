<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Liste des Superviseurs - STEG</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <script src="../assets/js/common.js"></script>
  </head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="../assets/images/STEG-logo.png" alt="Company Logo" class="logo">
      STEG - Gestion Stagiaires
    </div>
    <div class="top-actions">
      <button class="btn small" onclick="window.location.href='admin-dashboard.html'">Tableau de Bord</button>
      
      <button class="btn primary small" onclick="openPopup('supervisor')">+ Ajouter</button>
    </div>
  </header>
  <div class="admin-page">
    <section class="page-header">
      <h1>Liste des Superviseurs</h1>
      <p class="subtitle">Consultez, modifiez ou supprimez les superviseurs</p>
    </section>
    <section>
  <table class="data-table" data-enhanced data-page-size="10">
        <thead>
          <tr>
            <th>Nom</th>
            <th>Email</th>
            <th>Département</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="supervisors-list">
          <tr>
            <td>Samira Ben Salah</td>
            <td>samira.bensalah@steg.tn</td>
            <td>Informatique</td>
            <td>
              <button class="btn outline small" onclick="editSupervisor(this)">Modifier</button>
              <button class="btn danger small" onclick="deleteSupervisor(this)">Supprimer</button>
            </td>
          </tr>
        </tbody>
      </table>
    </section>
  </div>
  <div id="popup-overlay" class="popup hidden">
    <div class="popup-panel">
      <button class="popup-close" onclick="closePopup()">&times;</button>
      <div id="popup-body"></div>
    </div>
  </div>
  <script src="../assets/js/table-utils.js"></script>
  <script>
    function openPopup(type, row){
      const body = document.getElementById('popup-body');
      body.innerHTML = '';
      if (type==='supervisor'){
        body.innerHTML = `<h2>Ajouter un Superviseur</h2>
          <form id=\"addSupForm\">
            <div class=\"form-field\"><label>Nom</label><input name=\"name\" required></div>
            <div class=\"form-field\"><label>Email</label><input type=\"email\" name=\"email\" required></div>
            <div class=\"form-field\"><label>Département</label><input name=\"department\"></div>
            <div class=\"form-actions\">
              <button type=\"submit\" class=\"btn primary\">Enregistrer</button>
              <button type=\"button\" class=\"btn outline\" onclick=\"closePopup()\">Annuler</button>
            </div>
          </form>`;
        body.innerHTML = `<h2>Modifier le Superviseur</h2>
          <form id=\"editSupForm\">
            <div class=\"form-field\"><label>Nom</label><input name=\"name\" value=\"${tds[0].textContent}\" required></div>
            <div class=\"form-field\"><label>Email</label><input type=\"email\" name=\"email\" value=\"${tds[1].textContent}\" required></div>
            <div class=\"form-field\"><label>Département</label><input name=\"department\" value=\"${tds[2].textContent}\"></div>
            <div class=\"form-actions\">
              <button type=\"submit\" class=\"btn primary\">Enregistrer</button>
              <button type=\"button\" class=\"btn outline\" onclick=\"closePopup()\">Annuler</button>
            </div>
              <button type=\"submit\" class=\"btn primary\">Enregistrer</button>
              <button type=\"button\" class=\"btn outline\" onclick=\"closePopup()\">Annuler</button>
            </div>
          </form>`;
        document.getElementById('editSupForm').addEventListener('submit', (e)=>{e.preventDefault();alert('Superviseur modifié (demo).');closePopup();});
      }
      document.getElementById('popup-overlay').classList.remove('hidden');
    }
    function editSupervisor(btn){openPopup('edit', btn.closest('tr'));}
    function deleteSupervisor(btn){ if(confirm('Supprimer ce superviseur ? (demo)')) btn.closest('tr').remove(); }
  </script>
</body>
</html>
