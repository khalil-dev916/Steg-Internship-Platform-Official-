<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Gestion des Stagiaires</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="../assets/images/STEG-logo.png" alt="Company Logo" class="logo">
      STEG - Gestion Stagiaires
    </div>
    <div class="top-actions">
      
    </div>
  </header>
  <div class="login-container">
    <div class="login-box modern-login">
      <div class="login-header">
        <img src="../assets/images/STEG-logo.png" alt="STEG Logo" class="login-logo">
        <h2>Connexion Administrateur</h2>
      </div>
      <form id="login-form">
        <div class="form-group">
          <label for="username">Nom d'utilisateur</label>
          <input type="text" id="username" name="username" required placeholder="Entrez votre nom d'utilisateur">
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" required placeholder="Entrez votre mot de passe">
        </div>
        <button type="submit" class="btn primary login-btn">Se connecter</button>
      </form>
      <div class="login-footer">
        <span class="login-help">Mot de passe oublié ? <a href="#" class="login-link">Contactez l'administrateur</a></span>
      </div>
    </div>
  </div>
  <script src="../assets/js/common.js"></script>
  <script>
    // Initialize theme
     document.addEventListener('DOMContentLoaded', function() {
       // No theme initialization
     });
  </script>
</body>
</html>
